# Application Configuration - DocScanner
# Profile: default (H2 embedded database - zero dependency startup)

spring.application.name=DocScanner

# =====================================================
# DATABASE: H2 Embedded (default profile)
# =====================================================
spring.datasource.url=jdbc:h2:file:./data/docscanner;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# =====================================================
# APPLICATION SETTINGS
# NOTE: Property names use kebab-case which maps to camelCase fields
# e.g. docscanner.upload-dir → uploadDir in StorageConfig
# =====================================================
docscanner.upload-dir=./uploads
docscanner.chunk-size=500
docscanner.chunk-overlap=100
docscanner.vector-top-k=5
docscanner.vector-similarity-threshold=0.22

# Tesseract OCR path (nested config → docscanner.tesseract.data-path)
docscanner.tesseract.data-path=./tessdata
docscanner.tesseract.language=eng

# =====================================================
# OPENAI (Optional — app runs fully without this)
# Set OPENAI_API_KEY environment variable, or uncomment below:
# docscanner.openai.api-key=sk-...
# =====================================================
docscanner.openai.api-key=${OPENAI_API_KEY:}
docscanner.openai.model=gpt-4o-mini
docscanner.openai.embedding-model=text-embedding-3-small
docscanner.openai.base-url=https://api.openai.com/v1
docscanner.openai.max-tokens=1500
docscanner.openai.temperature=0.3

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=DocScanner
info.app.version=1.0.0
info.app.institution=Galgotias College of Engineering & Technology
info.app.department=Artificial Intelligence & Machine Learning

# =====================================================
# LOGGING
# =====================================================
logging.level.com.galgotias.docscanner=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
