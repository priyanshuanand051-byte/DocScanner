# MySQL Production Profile
# Usage: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# OR: Set SPRING_PROFILES_ACTIVE=mysql environment variable

# =====================================================
# DATABASE: MySQL
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/docscanner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console
spring.h2.console.enabled=false
